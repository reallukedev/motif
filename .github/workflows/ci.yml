# Package tests on macOS and the iOS Simulator, plus unsigned builds of both apps.
# `./build.sh ci` runs the same locally.
# Unsigned builds only prove the code compiles; use `./build.sh mac` for a runnable Mac app.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a run when a newer push to the same ref arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  core-tests:
    name: MotifCore tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode may not be 27, and the 27 SDKs are required.
      - name: Select Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No /Applications/Xcode_27*.app on this runner; using $(xcode-select -p)"
          fi
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      # Keyed on the Xcode build too, since modules from another compiler won't import.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: MotifCore/.build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('MotifCore/Package.swift', 'MotifCore/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      - name: Run tests
        working-directory: MotifCore
        run: swift test

  # `swift test` only runs on the Mac, so the iOS-only code paths need the Simulator.
  core-tests-ios:
    name: MotifCore tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No /Applications/Xcode_27*.app on this runner; using $(xcode-select -p)"
          fi
          xcodebuild -version

      # Simulator names vary between runner images, so take an iPhone from the newest iOS
      # runtime rather than naming one.
      - name: Run tests
        working-directory: MotifCore
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | awk '
            /^-- iOS / { ios = 1; next }
            /^-- /     { ios = 0; next }
            ios && /iPhone/ { match($0, /[0-9A-F-]{36}/); id = substr($0, RSTART, RLENGTH) }
            END { print id }')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator on this runner"
            exit 1
          fi
          # Without -collect-test-diagnostics never, a failing test waits 10 minutes for a
          # simulator sysdiagnose before the job reports it.
          test=(
            xcodebuild test
            -scheme MotifCore-Package
            -destination "id=$udid"
            -skipPackagePluginValidation
            -collect-test-diagnostics never
          )
          if command -v xcbeautify >/dev/null; then
            "${test[@]}" 2>&1 | xcbeautify --renderer github-actions
          else
            "${test[@]}"
          fi

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Motif (iOS)
            destination: generic/platform=iOS Simulator
          - scheme: Motif (macOS)
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No /Applications/Xcode_27*.app on this runner; using $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "Using $(command -v xcodegen)"

      # The .xcodeproj is generated from project.yml and not committed.
      - name: Generate project
        run: xcodegen generate

      - name: Build
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          build=(
            xcodebuild
            -project Motif.xcodeproj
            -scheme "$SCHEME"
            -configuration Debug
            -destination "$DESTINATION"
            -skipPackagePluginValidation
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            build
          )
          if command -v xcbeautify >/dev/null; then
            "${build[@]}" 2>&1 | xcbeautify --renderer github-actions
          else
            "${build[@]}"
          fi
