name: Motif
options:
  bundleIdPrefix: dev.luke
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

configFiles:
  Debug: Config/Motif.xcconfig
  Release: Config/Motif.xcconfig

# Declared here because XcodeGen doesn't create schemes, and the ones Xcode autocreates live
# in `xcuserdata`, which isn't committed and is wiped by `xcodegen generate`. Without these,
# build.sh fails with "does not contain a scheme named …".
schemes:
  Motif (macOS):
    build:
      targets:
        Motif (macOS): all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MotifCore/MotifCoreTests
        - package: MotifCore/MotifMusicTests
    archive:
      config: Release
  Motif (iOS):
    build:
      targets:
        Motif (iOS): all
    run:
      config: Debug
    # The same package tests, run in the Simulator. MotifMusicTests has iOS-only suites.
    test:
      config: Debug
      targets:
        - package: MotifCore/MotifCoreTests
        - package: MotifCore/MotifMusicTests
    archive:
      config: Release

packages:
  MotifCore:
    path: MotifCore

targets:
  Motif (iOS):
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - target: MotifWidgets (iOS)
      - package: MotifCore
        product: MotifCore
      - package: MotifCore
        product: MotifMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOTIF_BUNDLE_ID)
        PRODUCT_NAME: Motif
        INFOPLIST_FILE: Apps/iOS/Resources/Info.plist
        # Motif-CarPlay.entitlements, which adds CarPlay Audio to Motif.entitlements. Set in
        # Config/Motif.xcconfig, so a copy built without the grant can switch back.
        CODE_SIGN_ENTITLEMENTS: $(MOTIF_IOS_ENTITLEMENTS)
        # The app is main-actor by default. MotifCore isn't, so callers decide where work runs.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # iPhone only. Motif ships for iPhone and the Mac; there's no iPad layout to stand
        # behind, so the App Store doesn't offer it there and it isn't listed as an iPad app.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # There's a native Mac app. Left on, Apple Silicon offers "My Mac (Designed for iPad)"
        # and macOS treats the iOS build as a second Motif with the same bundle id.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  MotifWidgets (macOS):
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/Shared
      - path: Widgets/macOS
      # Only the intent the widget's Play button uses and the file that picks its player.
      # The whole Intents folder would pull the capture stack into the extension.
      - path: Apps/Shared/Intents/PlayBackTodayIntent.swift
      - path: Apps/Shared/Playback/PlatformPlaybackService.swift
      # The widgets build the links the apps open; the apps' half is DeepLink+Routing.swift.
      - path: Apps/Shared/App/DeepLink.swift
    dependencies:
      - package: MotifCore
        product: MotifCore
      - package: MotifCore
        product: MotifMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOTIF_BUNDLE_ID).Widgets
        PRODUCT_NAME: MotifWidgets
        INFOPLIST_FILE: Widgets/macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/macOS/Resources/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  MotifWidgets (iOS):
    type: app-extension
    platform: iOS
    sources:
      # Same widget code as the Mac; Widgets/Shared has nothing platform-specific.
      - path: Widgets/Shared
      - path: Widgets/iOS
      - path: Apps/Shared/Intents/PlayBackTodayIntent.swift
      - path: Apps/Shared/Playback/PlatformPlaybackService.swift
      # The widgets build the links the apps open; the apps' half is DeepLink+Routing.swift.
      - path: Apps/Shared/App/DeepLink.swift
    dependencies:
      - package: MotifCore
        product: MotifCore
      - package: MotifCore
        product: MotifMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOTIF_BUNDLE_ID).Widgets
        PRODUCT_NAME: MotifWidgets
        INFOPLIST_FILE: Widgets/iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS/Resources/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Matches the app. An extension that still claims iPad fails App Store validation.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # Matches the app. Left on, the extension alone would keep the Mac destination.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  # Reopens the Mac app when it stops without being quit. Embedded in the app, which starts
  # it at launch; see Watchdog/WatchdogMain.swift.
  MotifWatchdog:
    type: application
    platform: macOS
    sources:
      - path: Watchdog
    dependencies:
      - package: MotifCore
        product: MotifCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOTIF_BUNDLE_ID).Watchdog
        PRODUCT_NAME: MotifWatchdog
        INFOPLIST_FILE: Watchdog/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watchdog/Resources/Watchdog.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  Motif (macOS):
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - target: MotifWidgets (macOS)
      # Where helper apps live in a Mac app. Not registered as a login item: the app opens it.
      - target: MotifWatchdog
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - package: MotifCore
        product: MotifCore
      - package: MotifCore
        product: MotifMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOTIF_BUNDLE_ID)
        PRODUCT_NAME: Motif
        INFOPLIST_FILE: Apps/macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Resources/Motif.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
